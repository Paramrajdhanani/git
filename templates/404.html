{% extends "base.html" %}

{% block title %}404 - Page Not Found | GitHub Profile Finder{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
  <div class="glass-card p-5 max-width-600 mx-auto" data-aos="zoom-in">
    <div class="display-1 fw-bold text-primary mb-3">404</div>
    <h2 class="fw-bold mb-3">Page Not Found</h2>
    <p class="text-muted mb-4">The page or GitHub resource you were looking for doesn't exist or has been moved.</p>
    <a href="{% url 'finder:home' %}" class="btn btn-primary btn-lg rounded-pill px-4">
      <i class="fas fa-home me-2"></i> Return to Home
    </a>
  </div>
</div>
{% endblock %}
