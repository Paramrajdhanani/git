{% extends "base.html" %}

{% block title %}Sign In - GitHub Profile Finder{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="glass-card p-4 p-md-5 max-width-500 mx-auto" data-aos="zoom-in">
    <div class="text-center mb-4">
      <i class="fab fa-github fa-3x text-primary mb-2"></i>
      <h2 class="fw-bold text-main">Welcome Back</h2>
      <p class="text-muted small">Sign in to access your saved favorites & search history dashboard.</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      
      <div class="mb-3">
        <label class="form-label text-main fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-muted"><i class="fas fa-user"></i></span>
          <input type="text" name="username" class="form-control glass-card text-main border-secondary" placeholder="Enter username" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label text-main fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary text-muted"><i class="fas fa-lock"></i></span>
          <input type="password" name="password" class="form-control glass-card text-main border-secondary" placeholder="Enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold mb-3">
        Sign In <i class="fas fa-sign-in-alt ms-1"></i>
      </button>

      <div class="text-center small text-muted">
        Don't have an account? <a href="{% url 'accounts:register' %}" class="text-primary fw-semibold">Register here</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
