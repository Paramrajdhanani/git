{% extends "base.html" %}

{% block title %}Account Preferences - GitHub Profile Finder{% endblock %}

{% block content %}
<div class="container py-5 max-width-700">
  <div class="glass-card p-4 p-md-5" data-aos="fade-up">
    <div class="d-flex align-items-center gap-3 mb-4">
      <i class="fas fa-cog fa-2x text-primary"></i>
      <div>
        <h2 class="fw-bold mb-0 text-main">Account Preferences</h2>
        <p class="text-muted small mb-0">Manage theme preferences and profile settings.</p>
      </div>
    </div>

    <form method="POST">
      {% csrf_token %}
      
      <div class="mb-3">
        <label class="form-label text-main fw-semibold">Default Theme Preference</label>
        {{ form.theme_preference }}
      </div>

      <div class="mb-3">
        <label class="form-label text-main fw-semibold">Preferred Language</label>
        {{ form.preferred_language }}
      </div>

      <div class="mb-4">
        <label class="form-label text-main fw-semibold">Bio / Notes</label>
        {{ form.bio }}
      </div>

      <button type="submit" class="btn btn-primary rounded-pill px-4">
        <i class="fas fa-save me-1"></i> Save Settings
      </button>
    </form>
  </div>
</div>
{% endblock %}
